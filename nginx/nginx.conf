# RoleRadar High-Availability Production Load Balancer (Item 28)
# Reverse Proxy with Round-Robin Distribution & Upstream Keepalive

worker_processes auto;
events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Performance Tuning
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Upstream Application Cluster (Load Balancing: Item 28)
  upstream roleradar_cluster {
    least_conn; # Routes traffic to instance with lowest active connections
    server app_node_1:3000 max_fails=3 fail_timeout=10s;
    server app_node_2:3000 max_fails=3 fail_timeout=10s;
    server app_node_3:3000 max_fails=3 fail_timeout=10s;
    keepalive 32; # Reuses persistent TCP connections between Nginx and Node instances
  }

  server {
    listen 80;
    server_name _;

    # Client body limit
    client_max_body_size 5M;

    # Static Assets Caching & CDN Emulation (Items 6 & 27)
    location ~* \.(js|css|woff2|woff|ttf|png|jpe?g|webp|avif|svg|ico)$ {
      proxy_pass http://roleradar_cluster;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API and Dynamic Requests Load Balanced
    location / {
      proxy_pass http://roleradar_cluster;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Trace-Id $request_id; # OpenTelemetry Distributed Trace Link

      # Timeouts for external upstream protection (Item 12)
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 15s;
    }
  }
}

